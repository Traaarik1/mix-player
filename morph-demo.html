<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Смена обложек</title>
<style>body{margin:0;background:#0e0b12;color:#E9E4EE;font:15px system-ui;padding:16px}h1{font-size:18px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.c{text-align:center}canvas{width:100%;aspect-ratio:1;border-radius:14px;box-shadow:0 10px 30px #0008}b{display:block;margin-top:8px}</style>
<h1>Варианты смены обложки (повторяются по кругу)</h1><div class="g" id="g"></div>
<script>
const S=300,names=['1. Растворение пикселями','2. Жидкое перетекание','3. Переворот карточкой','4. Цветовая волна','5. Размытие с наплывом'];
function cover(a,b,c,shape){const cv=document.createElement('canvas');cv.width=cv.height=S;const x=cv.getContext('2d');const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,S,S);x.fillStyle=c;x.beginPath();shape?x.arc(S*.5,S*.45,S*.25,0,7):(x.moveTo(S*.5,S*.15),x.lineTo(S*.85,S*.75),x.lineTo(S*.15,S*.75));x.fill();x.fillStyle='#fff';x.font='bold 34px system-ui';x.fillText(shape?'NIGHT':'SUNSET',S*.08,S*.92);return cv}
const covers=[cover('#ff7a45','#7b2cbf','#ffd166',0),cover('#0b3d91','#00c2a8','#e0f7ff',1)];
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const rnd=[...Array(400)].map(Math.random);
const fx=[
(x,A,B,t)=>{x.drawImage(A,0,0);const n=20,s=S/n;for(let i=0;i<n*n;i++){const k=Math.min(1,Math.max(0,(t*1.6-rnd[i]*.6)));if(!k)continue;const cx=i%n*s,cy=(i/n|0)*s,w=s*k;x.drawImage(B,cx,cy,s,s,cx+(s-w)/2,cy+(s-w)/2,w,w)}},
(x,A,B,t)=>{const amp=Math.sin(t*Math.PI)*22;for(const[img,al]of[[A,1-t],[B,t]]){x.globalAlpha=al;for(let y=0;y<S;y+=2){const o=Math.sin(y*.05+t*12)*amp;x.drawImage(img,0,y,S,2,o,y,S,2)}}x.globalAlpha=1},
(x,A,B,t)=>{const a=t*Math.PI,sx=Math.abs(Math.cos(a));x.fillStyle='#0e0b12';x.fillRect(0,0,S,S);x.save();x.translate(S/2,0);x.scale(sx,1);x.drawImage(t<.5?A:B,-S/2,0);x.fillStyle=`rgba(0,0,0,${(1-sx)*.5})`;x.fillRect(-S/2,0,S,S);x.restore()},
(x,A,B,t)=>{x.drawImage(A,0,0);x.save();x.beginPath();x.arc(S/2,S/2,t*S*.75,0,7);x.clip();x.drawImage(B,0,0);x.restore();x.strokeStyle=`rgba(255,255,255,${Math.sin(t*Math.PI)*.6})`;x.lineWidth=6;x.beginPath();x.arc(S/2,S/2,t*S*.75,0,7);x.stroke()},
(x,A,B,t)=>{x.filter=`blur(${t*18}px)`;x.globalAlpha=1-t;x.drawImage(A,0,0);x.filter=`blur(${(1-t)*18}px)`;x.globalAlpha=t;x.drawImage(B,0,0);x.filter='none';x.globalAlpha=1}];
const ctxs=names.map(n=>{const d=document.createElement('div');d.className='c';d.innerHTML=`<canvas width=${S} height=${S}></canvas><b>${n}</b>`;g.append(d);return d.firstChild.getContext('2d')});
function loop(ms){const T=2600,p=(ms%T)/T,cyc=Math.floor(ms/T)%2,A=covers[cyc],B=covers[1-cyc],t=p<.4?0:ease(Math.min(1,(p-.4)/.45));ctxs.forEach((x,i)=>{x.clearRect(0,0,S,S);fx[i](x,A,B,t)});requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
