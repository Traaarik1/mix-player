  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute">

    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 6.2v11.6a1 1 0 0 0 1.6.8l8-5.8a1 1 0 0 0 0-1.6l-8-5.8A1 1 0 0 0 5 6.2Z"/><rect x="16.5" y="5" width="2.5" height="14" rx="1"/></symbol>

    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.3 10.6 19C5.4 14.4 2 11.3 2 7.6 2 4.5 4.4 2.2 7.5 2.2c1.7 0 3.4.8 4.5 2.1 1.1-1.3 2.8-2.1 4.5-2.1 3.1 0 5.5 2.3 5.5 5.4 0 3.7-3.4 6.8-8.6 11.4L12 20.3Z"/></symbol>

    <symbol id="i-all" viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7Z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 6h12v2H3V6Zm0 5h12v2H3v-2Zm0 5h8v2H3v-2Zm14-5v6.3A3 3 0 1 0 19 20v-7h3v-2h-5Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></symbol>
    <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 1-2Zm3 5v2h10V8H7Zm0 4v2h7v-2H7Z"/></symbol>
    <symbol id="i-wand" viewBox="0 0 24 24"><path d="m14.6 6.5 2.9 2.9L7.4 19.5l-2.9-2.9L14.6 6.5ZM19 2l.9 2.1L22 5l-2.1.9L19 8l-.9-2.1L16 5l2.1-.9L19 2ZM9 2l.6 1.4L11 4l-1.4.6L9 6l-.6-1.4L7 4l1.4-.6L9 2Zm11 9 .6 1.4L22 13l-1.4.6L20 15l-.6-1.4L18 13l1.4-.6L20 11Z"/></symbol>

    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4v-2Z"/></symbol>
  </svg>

  <div class="app">
    <aside class="rail">
      <div class="logo"><span class="logo-mark"><span></span><span></span></span>Mix</div>
      <nav class="nav" id="nav"></nav>
      <div class="rail-foot">
        <div class="tgcard" id="tgcard"></div>
        <div class="store" id="store"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="head">
        <h1 id="viewTitle">Вся музыка<span class="sub" id="viewSub"></span></h1>
        <div class="head-tools">
          <input class="search" id="search" type="search" placeholder="Найти трек или артиста" autocomplete="off">
          <select class="sortsel" id="sort" title="Сортировка">
            <option value="added-desc">Сначала новые</option>
            <option value="added-asc">Сначала старые</option>
            <option value="title">По названию</option>
            <option value="artist">По автору</option>
            <option value="album">По альбому</option>
            <option value="released-new">Дата выхода: новые</option>
            <option value="released-old">Дата выхода: старые</option>
            <option value="duration">Самые длинные</option>
            <option value="plays">Чаще слушаю</option>
          </select>
          <button class="btn primary" id="playAll"><svg><use href="#i-shuffle"/></svg>Слушать вперемешку</button>
          <button class="btn" id="addFiles" title="Добавить файлы с компьютера"><svg><use href="#i-plus"/></svg><span class="lbl">Файлы</span></button>
        </div>
      </div>
      <section class="shelf" id="shelf" hidden></section>
      <section class="empty" id="empty" hidden></section>
      <ul class="rows" id="rows"></ul>
      <section id="extra"></section>
    </main>
  </div>

  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>

  <footer class="bar" id="bar">
    <div class="np">
      <button class="np-cover" id="openFull" title="Сейчас играет"></button>
      <div class="ttl"><span class="t" id="npTitle">Ничего не играет</span><span class="a" id="npArtist">Выбери трек</span></div>
      <button class="ib like" id="npLike" title="В любимое" hidden><svg><use href="#i-heart-o"/></svg></button>
      <button class="ib" id="npAdd" title="Добавить в любимое, альбом или мою музыку" hidden><svg><use href="#i-plus"/></svg></button>
    </div>
    <div class="ctrl">
      <div class="btns">
        <button class="ib" data-act="shuffle" title="Перемешивать"><svg><use href="#i-shuffle"/></svg></button>
        <button class="ib" data-act="prev" title="Назад"><svg><use href="#i-prev"/></svg></button>
        <button class="pp" data-act="toggle" title="Играть / пауза"><svg><use href="#i-play"/></svg></button>
        <button class="ib next" data-act="next" title="Дальше"><svg><use href="#i-next"/></svg></button>
        <button class="ib" data-act="repeat" title="Повторять"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div class="prog"><span data-pos>0:00</span><div class="track" data-seek><div class="fill"></div><div class="knob"></div></div><span data-dur>0:00</span></div>
    </div>
    <div class="side">
      <button class="mixchip" id="mixChip" title="Переход между треками"></button>
      <button class="ib" data-act="lyrics" title="Текст песни"><svg><use href="#i-lyrics"/></svg></button>
      <button class="ib" id="queueBtn" title="Очередь"><svg><use href="#i-queue"/></svg></button>
      <button class="ib" id="miniBtn" title="Мини-плеер: маленькое окно поверх остальных"><svg><use href="#i-mini"/></svg></button>
      <button class="ib" id="eqBtn" title="Эквалайзер"><svg><use href="#i-eq"/></svg></button>
      <svg style="color:var(--mist);margin-left:6px"><use href="#i-vol"/></svg>
      <input class="vol" id="vol" type="range" min="0" max="100" title="Громкость">
    </div>
  </footer>

  <section class="full" id="full" aria-label="Сейчас играет">
    <div class="grab fullgrab"></div>
    <button class="close" id="closeFull" title="Свернуть"><svg style="margin:auto"><use href="#i-down"/></svg></button>
    <div class="stack" id="stack"></div>
    <div class="lyrics" id="lyrics" hidden></div>
    <div class="fmeta">
      <div class="label" id="fLabel"></div>
      <h2 class="ftitle" id="fTitle"></h2>
      <div class="fartist" id="fArtist"></div>
      <div class="fadd">
        <button class="ib like" id="fLike" title="В любимое"><svg><use href="#i-heart-o"/></svg></button>
        <button class="btn" id="fAdd" title="Добавить в любимое, альбом или мою музыку"><svg><use href="#i-plus"/></svg>Добавить</button>
      </div>
      <div class="prog"><span data-pos>0:00</span><div class="track" data-seek><div class="fill"></div><div class="knob"></div></div><span data-dur>0:00</span></div>
      <div class="btns">
        <button class="ib" data-act="shuffle" title="Перемешивать"><svg><use href="#i-shuffle"/></svg></button>
        <button class="ib" data-act="prev" title="Назад"><svg><use href="#i-prev"/></svg></button>
        <button class="pp" data-act="toggle" title="Играть / пауза"><svg><use href="#i-play"/></svg></button>
        <button class="ib" data-act="next" title="Дальше"><svg><use href="#i-next"/></svg></button>
        <button class="ib" data-act="repeat" title="Повторять"><svg><use href="#i-repeat"/></svg></button>
        <button class="ib" data-act="lyrics" title="Текст песни"><svg><use href="#i-lyrics"/></svg></button>
      </div>
      <div class="fextra"><button class="mixchip" id="fMix"></button><button class="ib" id="fEq" title="Эквалайзер"><svg><use href="#i-eq"/></svg></button><button class="ib" id="fQueue" title="Очередь"><svg><use href="#i-queue"/></svg></button></div>
      <div class="fnext" id="fNext"></div>
    </div>
  </section>

  <div id="layer"></div>
  <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav" multiple hidden>
  <script>
    // Если плеер не запустился, показываем причину прямо на странице
    (function () {
      var errs = [];
      function show(msg) {
        var b = document.getElementById('bootErr');
        if (!b) {
          b = document.createElement('div'); b.id = 'bootErr';
          b.style.cssText = 'position:fixed;left:16px;right:16px;top:16px;z-index:99;background:#3a1020;color:#ffd7de;border:1px solid #ff8f9f;border-radius:14px;padding:14px 18px;font:14px/1.5 system-ui;white-space:pre-wrap';
          b.title = 'Нажми, чтобы скрыть';
          b.onclick = function () { b.remove(); errs = []; };
          document.body.appendChild(b);
        }
        errs.push(msg); console.error('MIXERR ' + msg);
        b.textContent = 'Плеер сломался. Сделай скриншот этого сообщения и пришли его.\n\n' + errs.join('\n') + '\n\nБраузер: ' + navigator.userAgent;
      }
      window.__mixErr = show;
      addEventListener('error', function (e) {
        var el = e.target;
        if (el && el !== window && (el.src || el.href)) {
          // шрифты и картинки не критичны; ломает плеер только скрипт
          if (el.tagName === 'SCRIPT') show('Не загрузился код плеера: ' + el.src + '. Если стоит блокировщик рекламы, отключи его для этой страницы.');
          return;
        }
        // «Script error.» без файла — чужой скрипт, например расширение браузера: плеер от него не ломается
        if (e.message === 'Script error.' && !e.filename) { console.warn(e.message); return; }
        show(e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
      }, true);
      addEventListener('unhandledrejection', function (e) {
        var n = e.reason && e.reason.name;
        if (n === 'AbortError' || n === 'NotAllowedError' || n === 'NotSupportedError') return; // браузер прервал звук — это не поломка
        show(String(e.reason && (e.reason.stack || e.reason.message) || e.reason));
      });
      setTimeout(function () { if (!window.__mixReady) show('Код плеера не загрузился за 8 секунд.' + (location.protocol === 'file:' ? ' Страница открыта как файл, открой http://localhost:5173' : '')); }, 8000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
